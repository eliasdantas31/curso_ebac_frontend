<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="./styles/main.scss">
</head>
<body>
    <header class="header">
        <div class="header__container container">
            <img id="avatar" class="header__container__avatar" src="https://placehold.co/180x180" alt=".">
            <h1 id="name" class="header__container__name"></h1>
            <h2 id="username" class="header__container__username"></h2>
            <ul class="header__container__numbers">
                <li class="header__container__numbers__item">
                    <h4>Repositórios</h4>
                    <span id="repos"></span>
                </li>
                <li class="header__container__numbers__item">
                    <h4>Seguidores</h4>
                    <span id="followers"></span>
                </li>
                <li class="header__container__numbers__item">
                    <h4>Seguindo</h4>
                    <span id="following"></span>
                </li>
            </ul>
            <a href="#" id="link" class="header__container__link">Ver no Github</a>
        </div>
    </header>
    <script src="./scripts/main.js"></script>
</body>
</html>
